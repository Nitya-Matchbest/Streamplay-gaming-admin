<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Blogs - StreamPlay Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/manage.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Manage Blogs</h1>
            <div class="nav-buttons">
                <a href="index.html" class="btn btn-secondary">➕ Create New Blog</a>
            </div>
        </div>
        
        <div class="subtitle">View, edit, and delete existing blog posts</div>

        <div class="success-message" id="successMessage"></div>
        <div class="error-message" id="errorMessage"></div>

        <!-- Search and Filter -->
        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Search blogs..." class="search-input">
            <select id="categoryFilter" class="category-filter">
                <option value="all">All Categories</option>
                <option value="Latest Article">Latest Article</option>
                <option value="Consumption">Consumption</option>
                <option value="Technology">Technology</option>
                <option value="OTT Trends">OTT Trends</option>
                <option value="Entertainment">Entertainment</option>
            </select>
        </div>

        <!-- Blogs Table -->
        <div class="blogs-container" id="blogsContainer">
            <div class="loading">Loading blogs...</div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ Edit Blog</h2>
                <span class="close" onclick="closeEditModal()">&times;</span>
            </div>
            <form id="editForm">
                <input type="hidden" id="editBlogId">
                
                <div class="form-group">
                    <label>Title <span class="required">*</span></label>
                    <input type="text" id="editTitle" required maxlength="200">
                    <div class="char-count"><span id="editTitleCount">0</span>/200</div>
                </div>

                <div class="form-group">
                    <label>Excerpt <span class="required">*</span></label>
                    <textarea id="editExcerpt" required maxlength="300"></textarea>
                    <div class="char-count"><span id="editExcerptCount">0</span>/300</div>
                </div>

                <div class="form-group">
                    <label>Category <span class="required">*</span></label>
                    <select id="editCategory" required>
                        <option value="Latest Article">Latest Article</option>
                        <option value="Consumption">Consumption</option>
                        <option value="Technology">Technology</option>
                        <option value="OTT Trends">OTT Trends</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Featured Image URL <span class="required">*</span></label>
                    <input type="text" id="editFeaturedImage" required readonly style="background: #f5f5f5;">
                    <div class="help-text">Image cannot be changed after creation</div>
                </div>

                <div class="form-group">
                    <label>Meta Description</label>
                    <textarea id="editMetaDescription" maxlength="160"></textarea>
                    <div class="char-count"><span id="editMetaCount">0</span>/160</div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">💾 Save Changes</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>⚠️ Confirm Delete</h2>
                <span class="close" onclick="closeDeleteModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this blog?</p>
                <p class="delete-blog-title" id="deleteBlogTitle"></p>
                <p class="warning-text">⚠️ This action cannot be undone!</p>
            </div>
            <div class="button-group">
                <button class="btn btn-danger" onclick="confirmDelete()">🗑️ Delete</button>
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/manage.js?v=2"></script>
</body>
</html>
