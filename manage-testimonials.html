<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Testimonials - StreamPlay Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/manage.css?v=1781507176897">

    <style>
        .btn-edit { background-color: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background-color 0.2s; }
        .btn-edit:hover { background-color: #2980b9; }
        .btn-delete { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background-color 0.2s; }
        .btn-delete:hover { background-color: #c0392b; }
        .btn-secondary { background-color: #95a5a6; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .btn-secondary:hover { background-color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <div class="admin-sidebar">
            <h3>Navigation</h3>
            <ul class="sidebar-nav">
                <li><a href="index.html">Add Blog</a></li>
                <li><a href="manage.html">Manage Blogs</a></li>
                <li><a href="add-testimonial.html">Add Testimonial</a></li>
                <li><a href="manage-testimonials.html" class="active">Manage Testimonials</a></li>
            </ul>
        </div>
        <div class="container">
            <div class="header">
                <h1>💬 Manage Testimonials</h1>
                <div class="nav-buttons">
                    <a href="add-testimonial.html" class="btn btn-secondary">➕ Add Testimonial</a>
                </div>
            </div>
            
            <div class="subtitle">View, edit, and delete existing testimonials</div>

            <div class="success-message" id="successMessage" style="display: none;"></div>
            <div class="error-message" id="errorMessage" style="display: none;"></div>

            <!-- Testimonials Table -->
            <div class="blogs-container" id="testimonialsContainer">
                <div class="loading">Loading testimonials...</div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ Edit Testimonial</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    
                    <div class="form-group">
                        <label>Author Name <span class="required">*</span></label>
                        <input type="text" id="editAuthorName" required>
                    </div>

                    <div class="form-group">
                        <label>Author Role <span class="required">*</span></label>
                        <input type="text" id="editAuthorRole" required>
                    </div>

                    <div class="form-group">
                        <label>Quote <span class="required">*</span></label>
                        <textarea id="editQuote" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Stars</label>
                        <input type="number" id="editStars" min="1" max="5">
                    </div>

                    <div class="form-group">
                        <label>Author Image</label>
                        <div class="image-upload-wrapper" style="display: flex; gap: 10px; align-items: center;">
                            <input type="hidden" id="editAuthorImage" required>
                            <input type="file" id="editImageFile" accept="image/*" style="display: none;">
                            <button type="button" class="btn btn-secondary" id="editUploadBtn" onclick="document.getElementById('editImageFile').click()">Replace Image</button>
                            <span id="editUploadStatus" style="font-size: 14px;"></span>
                        </div>
                        <div id="editImagePreview" style="margin-top: 10px; display: none;">
                            <img id="editPreviewImg" src="" alt="Preview" style="max-width: 100px; max-height: 100px; border-radius: 4px; border: 1px solid #ddd; object-fit: cover;">
                        </div>
                    </div>
                    
                    <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="editIsFeatured" style="width: auto;">
                        <label for="editIsFeatured" style="margin-bottom: 0;">Featured Testimonial</label>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://streamplay-gaming.onrender.com';

        document.addEventListener('DOMContentLoaded', fetchTestimonials);

        async function fetchTestimonials() {
            try {
                const response = await fetch(`${API_BASE}/api/testimonials`);
                const result = await response.json();
                if (result.success) {
                    renderTestimonials(result.data);
                }
            } catch (error) {
                document.getElementById('testimonialsContainer').innerHTML = `<div class="error-message">Error loading testimonials: ${error.message}</div>`;
            }
        }

        function renderTestimonials(testimonials) {
            const container = document.getElementById('testimonialsContainer');
            if (testimonials.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">No testimonials found.</div>';
                return;
            }

            container.innerHTML = testimonials.map(t => `
                <div class="blog-card" style="display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee;">
                    <div class="blog-info" style="flex: 1;">
                        <div style="font-weight: bold;">${t.authorName} (${t.authorRole}) ${t.isFeatured ? '⭐' : ''}</div>
                        <div style="color: #666; font-size: 14px; margin-top: 5px;">"${t.quote.substring(0, 60)}..."</div>
                    </div>
                    <div class="blog-actions" style="display: flex; gap: 10px;">
                        <button class="btn-edit" onclick='openEditModal(${JSON.stringify(t).replace(/'/g, "&#39;")})'>Edit</button>
                        <button class="btn-delete" onclick="deleteTestimonial('${t._id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Edit Modal Logic
        const modal = document.getElementById('editModal');
        const closeBtn = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');

        function openEditModal(testimonial) {
            document.getElementById('editId').value = testimonial._id;
            document.getElementById('editAuthorName').value = testimonial.authorName;
            document.getElementById('editAuthorRole').value = testimonial.authorRole;
            document.getElementById('editQuote').value = testimonial.quote;
            document.getElementById('editStars').value = testimonial.stars;
            document.getElementById('editAuthorImage').value = testimonial.authorImage;
            document.getElementById('editIsFeatured').checked = testimonial.isFeatured;
            
            if (testimonial.authorImage) {
                const imgUrl = testimonial.authorImage.startsWith('http') ? testimonial.authorImage : API_BASE + testimonial.authorImage;
                document.getElementById('editPreviewImg').src = imgUrl;
                document.getElementById('editImagePreview').style.display = 'block';
            } else {
                document.getElementById('editImagePreview').style.display = 'none';
            }
            document.getElementById('editUploadStatus').textContent = '';
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        closeBtn.onclick = closeModal;
        cancelBtn.onclick = closeModal;

        // Edit Modal Image Upload Logic
        document.getElementById('editImageFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const uploadBtn = document.getElementById('editUploadBtn');
            const uploadStatus = document.getElementById('editUploadStatus');

            uploadBtn.disabled = true;
            uploadStatus.textContent = 'Uploading...';
            uploadStatus.style.color = '#f39c12';

            try {
                const formData = new FormData();
                formData.append('image', file);

                const response = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('editAuthorImage').value = result.data.url;
                    
                    const previewImg = document.getElementById('editPreviewImg');
                    previewImg.src = API_BASE + result.data.url;
                    document.getElementById('editImagePreview').style.display = 'block';
                    
                    uploadStatus.textContent = '✅ Uploaded successfully!';
                    uploadStatus.style.color = '#27ae60';
                    
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 3000);
                } else {
                    throw new Error(result.message || 'Upload failed');
                }
            } catch (error) {
                console.error('Upload error:', error);
                uploadStatus.textContent = '❌ Upload failed';
                uploadStatus.style.color = '#e74c3c';
                alert('Failed to upload image: ' + error.message);
            } finally {
                uploadBtn.disabled = false;
            }
        });

        // Save Edit
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                authorName: document.getElementById('editAuthorName').value,
                authorRole: document.getElementById('editAuthorRole').value,
                quote: document.getElementById('editQuote').value,
                stars: document.getElementById('editStars').value,
                authorImage: document.getElementById('editAuthorImage').value,
                isFeatured: document.getElementById('editIsFeatured').checked
            };

            try {
                const response = await fetch(`${API_BASE}/api/testimonials/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    closeModal();
                    fetchTestimonials();
                    showSuccess('Testimonial updated successfully');
                } else {
                    const result = await response.json();
                    alert('Error updating testimonial: ' + (result.message || response.statusText));
                }
            } catch (error) {
                alert('Error updating testimonial: ' + error.message);
            }
        });

        // Delete Testimonial
        async function deleteTestimonial(id) {
            if (confirm('Are you sure you want to delete this testimonial?')) {
                try {
                    const response = await fetch(`${API_BASE}/api/testimonials/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        fetchTestimonials();
                        showSuccess('Testimonial deleted successfully');
                    }
                } catch (error) {
                    alert('Error deleting testimonial');
                }
            }
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
